<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Galeria de Famílias e retratos de Rafael Fotografia em Florianópolis."><title>Famílias e retratos | Rafael Fotografia</title><style>
 *{box-sizing:border-box}body{margin:0;background:#f8f7f4;color:#181818;font-family:Arial,Helvetica,sans-serif}a{color:inherit}.wrap{width:min(1120px,calc(100% - 36px));margin:auto}header{background:#111;color:white;padding:21px 0}nav{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-family:Georgia,serif;font-size:25px;text-decoration:none}.brand small{display:block;font:9px Arial;letter-spacing:4px}.back{text-decoration:none;font-size:14px}.back:hover{text-decoration:underline}main{padding:70px 0 90px}.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#777}h1{font:clamp(42px,6vw,76px) Georgia,serif;margin:12px 0}.subtitle{color:#666;line-height:1.7;max-width:600px}.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:42px}.photos figure{margin:0;overflow:hidden;background:#e5e3df}.photos img{display:block;width:100%;height:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .4s ease;cursor:zoom-in}.photos figure:first-child{grid-column:span 2}.photos figure:first-child img{aspect-ratio:16/9}.photos img:hover{transform:scale(1.025)}.cta{display:inline-block;background:#161616;color:#fff;padding:16px 24px;text-decoration:none;margin-top:36px}footer{border-top:1px solid #ddd;padding:28px 0;color:#777;font-size:13px}dialog{border:0;padding:0;background:transparent;max-width:95vw;max-height:95vh}dialog::backdrop{background:rgba(0,0,0,.9)}dialog img{max-width:95vw;max-height:88vh;object-fit:contain;display:block}dialog button{position:absolute;right:0;top:0;border:0;background:#fff;padding:10px 14px;cursor:pointer}@media(max-width:650px){main{padding:40px 0 65px}.photos{grid-template-columns:1fr;gap:12px;margin-top:26px}.photos figure:first-child{grid-column:span 1}.photos figure:first-child img,.photos img{aspect-ratio:4/5}.brand{font-size:21px}.back{font-size:12px}}</style></head><body><header><nav class="wrap"><a class="brand" href="index.html">Rafael<small>FOTOGRAFIA</small></a><a class="back" href="index.html#especialidades">← Voltar às especialidades</a></nav></header><main class="wrap"><span class="eyebrow">Portfólio / Especialidades</span><h1>Famílias e retratos</h1><p class="subtitle">Explore os registros deste ensaio. Clique em uma fotografia para visualizá-la em tamanho maior.</p><div class="photos"><figure><img src="fotos/familia-ensaio.jpg" alt="Fotografia do ensaio de Famílias e retratos" loading="lazy" tabindex="0"></figure><figure><img src="fotos/familia-ensaio-2.jpg" alt="Fotografia do ensaio de Famílias e retratos" loading="lazy" tabindex="0"></figure></div><a class="cta" href="https://wa.me/5548984188551?text=Ol%C3%A1%2C%20Rafael%21%20Gostaria%20de%20solicitar%20um%20or%C3%A7amento." target="_blank" rel="noopener noreferrer">Solicitar orçamento ↗</a></main><footer><div class="wrap">© <span id="year"></span> Rafael Fotografia</div></footer><dialog id="lightbox"><button type="button" aria-label="Fechar fotografia">✕</button><img alt="Fotografia ampliada"></dialog><script>document.getElementById('year').textContent=new Date().getFullYear();const d=document.getElementById('lightbox');document.querySelectorAll('.photos img').forEach(i=>{const open=()=>{d.querySelector('img').src=i.src;d.querySelector('img').alt=i.alt;d.showModal()};i.addEventListener('click',open);i.addEventListener('keydown',e=>{if(e.key==='Enter')open()})});d.querySelector('button').onclick=()=>d.close();d.addEventListener('click',e=>{if(e.target===d)d.close()});</script></body></html>
